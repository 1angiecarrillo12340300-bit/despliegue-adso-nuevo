name: CI/CD DevSecOps
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar Pytest
        run: pytest

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Bandit
        run: pip install bandit

      - name: Ejecutar Bandit (análisis estático de código)
        run: bandit -r . -f txt -o bandit-report.txt || true

      - name: Subir reporte de Bandit
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

      - name: Construir imagen Docker
        run: docker build -t despliegue-adso-nuevo:scan .

      - name: Ejecutar Trivy (escaneo de imagen y SBOM)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: despliegue-adso-nuevo:scan
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Subir reporte de Trivy
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  deploy:
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/despliegue-adso-nuevo
            git pull origin main
            docker compose up -d --build
